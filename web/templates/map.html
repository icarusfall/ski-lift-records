<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift map — Ski Lift Tracker</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --surface: #fcfcfb; --page: #f0f4f8; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--page); color: var(--ink); height: 100vh;
         display: flex; flex-direction: column; }
  header { background: #2b6cb0; color: white; padding: 0.85rem 1.5rem;
           display: flex; justify-content: space-between; align-items: center;
           gap: 1rem; flex-wrap: wrap; }
  header h1 { font-size: 1.2rem; }
  header a { color: #bee3f8; font-size: 0.85rem; text-decoration: none; }
  .bar { display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap;
         padding: 0.6rem 1.5rem; background: var(--surface);
         border-bottom: 1px solid var(--grid); font-size: 0.83rem; }
  select { border: 1px solid var(--grid); border-radius: 5px; padding: 0.25rem 0.4rem;
           font-size: 0.83rem; background: var(--surface); color: var(--ink); }
  label { color: var(--muted); margin-right: 0.3rem; }
  .legend { display: flex; gap: 0.55rem; align-items: center; font-size: 0.76rem;
            color: var(--ink-2); }
  .ramp { display: inline-flex; height: 10px; border-radius: 2px; overflow: hidden; }
  .ramp i { width: 16px; }
  .sw { display: inline-block; width: 12px; height: 4px; border-radius: 2px;
        vertical-align: 3px; margin-right: 4px; }
  #map { flex: 1; min-height: 300px; }
  .mapboxgl-popup-content { font-family: inherit; font-size: 0.8rem;
                            padding: 0.6rem 0.75rem; border-radius: 6px; }
  .mapboxgl-popup-content h3 { font-size: 0.85rem; margin-bottom: 0.25rem; }
  .mapboxgl-popup-content table { border-collapse: collapse; margin-top: 0.2rem; }
  .mapboxgl-popup-content td { padding: 1px 6px 1px 0; }
  .mapboxgl-popup-content td:last-child { font-variant-numeric: tabular-nums;
                                          font-weight: 600; }
  .warn { padding: 1.5rem; font-size: 0.9rem; color: var(--ink-2); }
  .warn code { background: var(--grid); padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>🗺 Lift map</h1>
  <a href="/explore">← Data explorer</a>
</header>

{% if not mapbox_token %}
  <div class="warn">
    <p>No <code>MAPBOX_TOKEN</code> is set on this service, so the map can't load.</p>
    <p style="margin-top:0.5rem;">Add a public Mapbox token (<code>pk.…</code>), URL-restricted
       to this site, as an environment variable named <code>MAPBOX_TOKEN</code>.</p>
  </div>
{% else %}
<div class="bar">
  <div>
    <label for="resort">Resort</label>
    <select id="resort">
      {% for r in resorts %}
        <option value="{{ r.id }}">{{ r.name }} ({{ r.ways }} lifts)</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="terrain">Terrain</label>
    <select id="terrain">
      <option value="1.4">3D</option>
      <option value="0">Flat</option>
    </select>
  </div>
  <div class="legend">
    <span>Days open:</span>
    <span>0%</span>
    <span class="ramp" id="ramp"></span>
    <span>100%</span>
    <span style="margin-left:0.5rem;">
      <span class="sw" style="background:#898781"></span>no observations
    </span>
  </div>
</div>
<div id="map"></div>
{% endif %}

<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script>
"use strict";
(function () {
  var TOKEN = {{ mapbox_token | tojson }};
  if (!TOKEN) return;
  mapboxgl.accessToken = TOKEN;

  // Sequential blue ramp from the project's chart palette.
  var SEQ = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#2a78d6", "#1c5cab", "#0d366b"];
  var NO_DATA = "#898781";

  var ramp = document.getElementById("ramp");
  SEQ.forEach(function (c) {
    var i = document.createElement("i");
    i.style.background = c;
    ramp.appendChild(i);
  });

  var map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/outdoors-v12",
    center: [7.63, 45.93],
    zoom: 12,
    pitch: 58,
    bearing: -15,
    antialias: true,
  });
  map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), "top-right");
  map.addControl(new mapboxgl.ScaleControl({ unit: "metric" }));

  var popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });

  function colourExpression() {
    // Interpolate the ramp over 0-100%, with unmatched lifts falling through
    // to a neutral grey rather than being drawn as if they never ran.
    var stops = [];
    SEQ.forEach(function (c, i) {
      stops.push(i * (100 / (SEQ.length - 1)), c);
    });
    return ["case",
      ["==", ["get", "pct_open"], null], NO_DATA,
      ["interpolate", ["linear"], ["get", "pct_open"]].concat(stops)];
  }

  function fitTo(geojson) {
    var b = new mapboxgl.LngLatBounds();
    geojson.features.forEach(function (f) {
      f.geometry.coordinates.forEach(function (c) { b.extend(c); });
    });
    if (!b.isEmpty()) map.fitBounds(b, { padding: 60, pitch: map.getPitch(), duration: 900 });
  }

  function load(resortId) {
    fetch("/api/geometry/" + resortId + ".json")
      .then(function (r) { return r.json(); })
      .then(function (gj) {
        var src = map.getSource("lifts");
        if (src) { src.setData(gj); }
        else {
          map.addSource("lifts", { type: "geojson", data: gj });
          // A wide, near-transparent casing gives a forgiving hit target and
          // keeps thin lines legible against busy terrain.
          map.addLayer({
            id: "lifts-hit", type: "line", source: "lifts",
            paint: { "line-width": 14, "line-opacity": 0.001, "line-color": "#000" },
          });
          map.addLayer({
            id: "lifts-casing", type: "line", source: "lifts",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: { "line-width": 6, "line-color": "#ffffff", "line-opacity": 0.85 },
          });
          map.addLayer({
            id: "lifts-line", type: "line", source: "lifts",
            layout: { "line-cap": "round", "line-join": "round" },
            paint: {
              "line-width": ["case", ["get", "is_link"], 5, 3],
              "line-color": colourExpression(),
            },
          });
          map.addLayer({
            id: "lifts-label", type: "symbol", source: "lifts",
            layout: {
              "symbol-placement": "line-center",
              "text-field": ["get", "name"],
              "text-size": 11,
              "text-offset": [0, 1.1],
            },
            paint: {
              "text-color": "#1a202c",
              "text-halo-color": "#ffffff",
              "text-halo-width": 1.6,
            },
          });

          map.on("mousemove", "lifts-hit", function (e) {
            map.getCanvas().style.cursor = "pointer";
            var p = e.features[0].properties;
            var rows = "";
            if (p.lift_name) {
              rows += "<tr><td>Days open</td><td>" +
                (p.pct_open === null || p.pct_open === undefined
                  ? "—" : Number(p.pct_open).toFixed(0) + "%") + "</td></tr>";
              rows += "<tr><td>Days recorded</td><td>" + p.days_operational + "</td></tr>";
            } else {
              rows += "<tr><td colspan='2'>Not yet matched to an observed lift</td></tr>";
            }
            rows += "<tr><td>Type</td><td>" + (p.aerialway || "—").replace(/_/g, " ") + "</td></tr>";
            rows += "<tr><td>Bearing</td><td>" + p.bearing + "°</td></tr>";
            rows += "<tr><td>Length</td><td>" + p.length_m + " m</td></tr>";
            popup.setLngLat(e.lngLat)
                 .setHTML("<h3>" + p.name + (p.is_link ? " · link" : "") + "</h3>" +
                          "<table>" + rows + "</table>")
                 .addTo(map);
          });
          map.on("mouseleave", "lifts-hit", function () {
            map.getCanvas().style.cursor = "";
            popup.remove();
          });
        }
        fitTo(gj);
      });
  }

  map.on("load", function () {
    map.addSource("dem", {
      type: "raster-dem",
      url: "mapbox://mapbox.mapbox-terrain-dem-v1",
      tileSize: 512, maxzoom: 14,
    });
    map.setTerrain({ source: "dem", exaggeration: 1.4 });
    map.setFog({ "horizon-blend": 0.2, color: "#eef3f8", "high-color": "#cfe0f2" });
    load(document.getElementById("resort").value);
  });

  document.getElementById("resort").addEventListener("change", function (e) {
    load(e.target.value);
  });
  document.getElementById("terrain").addEventListener("change", function (e) {
    var ex = parseFloat(e.target.value);
    map.setTerrain(ex ? { source: "dem", exaggeration: ex } : null);
    map.easeTo({ pitch: ex ? 58 : 0, duration: 600 });
  });
})();
</script>
</body>
</html>
