        + "model, which under-reads sharp summits by a hundred metres or so; that flatters "
        + "a nearby skyline slightly, so treat these as good to a few minutes rather than "
        + "to the minute." }));
}

const hhmmToH = s => { const [h, m] = s.split(":").map(Number); return h + m / 60; };

function sunPathChart(point, track) {
  const w = Math.max(620, ($("#view").clientWidth || 900) - 40), h = 330;
  const m = { l: 44, r: 16, t: 16, b: 42, w, h };
  const step = point.azimuth_step || 5;
  const lit = track.filter(p => p.el > -1);
  const azs = lit.map(p => p.az);
  // Winter sun never reaches the northern sky, so showing the full circle
  // would waste half the chart on empty horizon.
  const xDom = [Math.max(0, Math.min(...azs) - 25), Math.min(360, Math.max(...azs) + 25)];
  const yMax = Math.max(10, Math.max(...point.horizon, ...lit.map(p => p.el)) + 5);
  const x = v => m.l + (v - xDom[0]) / (xDom[1] - xDom[0]) * (w - m.l - m.r);
  const y = v => m.t + (1 - v / yMax) * (h - m.t - m.b);
  const svg = chartSvg(w, h);

  for (const v of niceTicks([0, yMax], 5)) {
    svg.appendChild(el("line", { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: GRID }));
    svg.appendChild(el("text", { x: m.l - 5, y: y(v) + 3, "text-anchor": "end",
      "font-size": 10, fill: MUTED, text: fmt(v, 0) + "°" }));
  }
  for (const [deg, label] of [[90, "E"], [135, "SE"], [180, "S"], [225, "SW"], [270, "W"]]) {
    if (deg < xDom[0] || deg > xDom[1]) continue;
    svg.appendChild(el("line", { x1: x(deg), x2: x(deg), y1: m.t, y2: h - m.b,
      stroke: GRID, "stroke-dasharray": "2 3" }));
    svg.appendChild(el("text", { x: x(deg), y: h - 26, "text-anchor": "middle",
      "font-size": 10, fill: MUTED, text: label }));
  }
  svg.appendChild(el("text", { x: (m.l + w - m.r) / 2, y: h - 8, "text-anchor": "middle",
    "font-size": 11, fill: INK2, text: "Compass bearing" }));

  // The skyline, as a filled silhouette.
  const pts = [];
  for (let a = Math.floor(xDom[0]); a <= xDom[1]; a += 1) {
    const i = a / step, lo = Math.floor(i) % point.horizon.length;
    const hi = (lo + 1) % point.horizon.length, f = i - Math.floor(i);
    pts.push([x(a), y(point.horizon[lo] * (1 - f) + point.horizon[hi] * f)]);
  }
  svg.appendChild(el("path", { fill: "#6b6a63", "fill-opacity": 0.55, stroke: "#4a4944",
    "stroke-width": 1,
    d: "M" + pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("L")
       + `L${x(xDom[1]).toFixed(1)},${y(0)}L${x(xDom[0]).toFixed(1)},${y(0)}Z` }));

  // The sun's track, drawn in two colours: above the skyline it is lit.
  const horizonAt = a => {
    const i = a / step, lo = Math.floor(i) % point.horizon.length;
    const hi = (lo + 1) % point.horizon.length, f = i - Math.floor(i);
    return point.horizon[lo] * (1 - f) + point.horizon[hi] * f;
  };
  for (let i = 0; i + 1 < lit.length; i++) {
    const a = lit[i], b = lit[i + 1];
    const up = a.el > horizonAt(a.az);
    svg.appendChild(el("line", { x1: x(a.az), y1: y(a.el), x2: x(b.az), y2: y(b.el),
      stroke: up ? "#eda100" : "#898781", "stroke-width": up ? 3 : 1.6,
      "stroke-opacity": up ? 1 : 0.6 }));
  }
  for (const p of lit) {
    if (!p.t.endsWith(":00")) continue;
    const up = p.el > horizonAt(p.az);
    const c = el("circle", { cx: x(p.az), cy: y(p.el), r: 3.4,
      fill: up ? "#eda100" : SURF, stroke: up ? SURF : BASE, "stroke-width": 1.4 });
    c.addEventListener("mousemove", e => showTip(
      `<div class="t-date">${p.t}</div><table>` +
      `<tr><td>Sun elevation</td><td>${fmt(p.el, 1)}°</td></tr>` +
      `<tr><td>Bearing</td><td>${fmt(p.az, 0)}°</td></tr>` +
      `<tr><td>Skyline there</td><td>${fmt(horizonAt(p.az), 1)}°</td></tr>` +
      `<tr><td>Status</td><td>${up ? "in sun" : "in shadow"}</td></tr></table>`,
      e.clientX, e.clientY));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
    svg.appendChild(el("text", { x: x(p.az), y: y(p.el) - 8, "text-anchor": "middle",
      "font-size": 9, fill: up ? INK2 : MUTED, text: p.t.slice(0, 2) }));
  }
  return svg;
}

/* ---------- 35 years of climate ---------- */
const CLIMATE_METRICS = {
  snow_depth:  { label: "Snow depth at the summit",   unit: "cm",   dp: 0, better: "up" },
  freezing_m:  { label: "Freezing level (estimated)", unit: "m",    dp: 0, better: "down" },
  temp_mean:   { label: "Mean temperature",           unit: "°C",   dp: 1, better: "down" },
  temp_max:    { label: "Mean daily maximum",         unit: "°C",   dp: 1, better: "down" },
  temp_min:    { label: "Mean daily minimum",         unit: "°C",   dp: 1, better: "down" },
  snowfall:    { label: "Total snowfall",             unit: "cm",   dp: 0, better: "up" },
  precip:      { label: "Total precipitation",        unit: "mm",   dp: 0, better: null },
  sunshine:    { label: "Sunshine per day",           unit: "h",    dp: 1, better: "up" },
  gust:        { label: "Mean daily max gust",        unit: "km/h", dp: 0, better: "down" },
  cloud:       { label: "Cloud cover",                unit: "%",    dp: 0, better: "down" },
};
/* Named windows people actually book, plus every week of the season. */
const CLIMATE_PRESETS = [
  ["Christmas",       "12-20", "12-27"],
  ["New Year",        "12-28", "01-04"],
  ["Mid-January",     "01-10", "01-17"],
  ["Feb half-term",   "02-14", "02-22"],
  ["Late February",   "02-23", "03-02"],
  ["Mid-March",       "03-10", "03-17"],
  ["Easter-ish",      "04-01", "04-08"],
];
let CLIM = null, climLoading = false;
let clim = { from: "02-14", to: "02-22", metric: "snow_depth", span: 8,
             stations: true };
// Which station field stands in for each modelled metric. Anything absent here
// has no measured counterpart, so the stations control is hidden for it.
const STATION_FIELD = { snow_depth: "hs_cm", snowfall: "hn_cm" };

function climKey() { return clim.from + "_" + clim.to; }
function loadClimate() {
  if (climLoading) return;
  climLoading = true;
  fetch(`/api/climate.json?from=${clim.from}&to=${clim.to}`)
    .then(r => r.json())
    .then(d => { CLIM = d; climLoading = false; render(); })
    .catch(e => { climLoading = false; CLIM = { error: e.message }; render(); });
}
const seasonLabel = y => y + "/" + String((y + 1) % 100).padStart(2, "0");
function mdLabel(md) {
  const [m, d] = md.split("-").map(Number);
  return d + " " + MONTHS[m - 1];
}
/* Least squares plus a rough 95% interval. With ~36 points and one week of
   weather per point the interval is usually wide, and saying so is the
   difference between a finding and a decoration. */
function trend(pts) {
  const n = pts.length;
  if (n < 6) return null;
  const mx = pts.reduce((a, p) => a + p.x, 0) / n;
  const my = pts.reduce((a, p) => a + p.y, 0) / n;
  let sxx = 0, sxy = 0;
  for (const p of pts) { sxx += (p.x - mx) ** 2; sxy += (p.x - mx) * (p.y - my); }
  if (!sxx) return null;
  const slope = sxy / sxx, intercept = my - slope * mx;
  let ss = 0;
  for (const p of pts) ss += (p.y - (slope * p.x + intercept)) ** 2;
  const se = Math.sqrt((ss / (n - 2)) / sxx);
  const half = 2.03 * se;                 // t(0.975) at ~34 d.f.
  return { slope, intercept, se, lo: slope - half, hi: slope + half, n,
           significant: (slope - half) * (slope + half) > 0 };
}

function renderClimate(host) {
  host.appendChild(el("h2", { text: "35 years of this week" }));
  host.appendChild(el("p", { class: "sub",
    text: "Pick the week you would go and watch it change. Every point is one season's "
        + "average over that calendar window, from the ERA5 reanalysis, 1991 to 2026 — the "
        + "same record the trip planner uses for how often bad weather turns up." }));

  const ctl = el("div", { class: "controls", style: "margin-bottom:0.5rem;" });
  const presets = el("div", { class: "group" }, el("label", { text: "Week:" }));
  for (const [name, a, b] of CLIMATE_PRESETS) {
    const on = clim.from === a && clim.to === b;
    presets.appendChild(el("button", { class: "preset" + (on ? " active" : ""), text: name,
      onclick: () => { clim.from = a; clim.to = b; CLIM = null; render(); } }));
  }
  ctl.appendChild(presets);
  const mk = (which) => {
    const s = el("select", { onchange: e => { clim[which] = e.target.value; CLIM = null; render(); } });
    for (let m = 11; m <= 16; m++) {
      const mm = ((m - 1) % 12) + 1;
      for (let day = 1; day <= 28; day += 1) {
        const v = String(mm).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        const o = el("option", { value: v, text: mdLabel(v) });
        if (clim[which] === v) o.setAttribute("selected", "");
        s.appendChild(o);
      }
    }
    return s;
  };
  ctl.appendChild(el("div", { class: "group" }, el("label", { text: "From:" }), mk("from"),
    el("label", { text: "to:" }), mk("to")));
  const ms = el("select", { onchange: e => { clim.metric = e.target.value; render(); } });
  for (const [k, v] of Object.entries(CLIMATE_METRICS)) {
    const o = el("option", { value: k, text: v.label });
    if (clim.metric === k) o.setAttribute("selected", "");
    ms.appendChild(o);
  }
  ctl.appendChild(el("div", { class: "group" }, el("label", { text: "Showing:" }), ms));
  host.appendChild(ctl);

  if (CLIM && CLIM.error) {
    host.appendChild(el("p", { class: "sub", text: "Could not load: " + CLIM.error }));
    return;
  }
  if (!CLIM || CLIM.window.from !== clim.from || CLIM.window.to !== clim.to) {
    host.appendChild(el("p", { class: "sub", text: "Reading 35 years…" }));
    loadClimate();
    return;
  }

  const picks = (selection.length ? selection : ["cervinia"])
    .filter(id => CLIM.resorts[id]).slice(0, 6);
  if (!picks.length) {
    host.appendChild(el("p", { class: "sub",
      text: "Select a resort above to plot it." }));
    return;
  }
  const M = CLIMATE_METRICS[clim.metric];
  host.appendChild(el("p", { class: "sub",
    text: M.label + ", " + mdLabel(clim.from) + " to " + mdLabel(clim.to)
        + ", by season." }));

  const series = picks.map(id => ({
    id, name: CLIM.resorts[id].name, top: CLIM.resorts[id].top_m,
    pts: CLIM.resorts[id].years
      .filter(y => y[clim.metric] != null)
      .map(y => ({ x: y.season, y: Number(y[clim.metric]), n: y.n })),
  })).filter(s => s.pts.length > 4);
  const dropped = picks
    .filter(id => !series.some(s => s.id === id))
    .map(id => CLIM.resorts[id].name);
  if (dropped.length) {
    host.appendChild(el("p", { class: "sub", style: "color:var(--s2);",
      text: dropped.join(", ") + (dropped.length > 1 ? " have" : " has")
          + " no usable " + M.label.toLowerCase() + " for this window."
          + (clim.metric === "snow_depth"
             ? " ERA5 models a permanently glaciated cell as carrying tens of metres of snow "
               + "all year, so those seasons are withheld rather than plotted. It affects "
               + "very few resorts — but Cervinia is one of them, which is a nuisance given "
               + "it is the resort this whole project is about."
               + (clim.stations
                  ? " The measured weather stations below cover it instead, which is "
                    + "much of the reason they were added."
                  : " Ticking “measured weather stations” below covers it another way.")
             : "") }));
  }
  // Deliberately no early return here. Cervinia has no modelled snow depth at
  // all — the glacier ceiling nulls it — and measured stations are the only
  // series it can ever have, so bailing on an empty modelled set would hide
  // exactly the data that fills the gap.

  // Measured station series, drawn beside the modelled one rather than
  // instead of it. Secondary stations only appear for a single resort —
  // six resorts times four stations is twenty-four lines and no insight.
  const field = STATION_FIELD[clim.metric];
  const stationSeries = [];
  if (field && clim.stations) {
    for (const id of picks) {
      const all = CLIM.resorts[id].stations || [];
      const wanted = picks.length === 1 ? all : all.filter(s => s.primary);
      for (const st of wanted) {
        const pts = st.years.filter(y => y[field] != null)
          .map(y => ({ x: y.season, y: Number(y[field]), n: y.n }));
        if (pts.length > 4)
          stationSeries.push({ id, station: st, pts,
                               colour: SERIES[slotOf.get(id) ?? 0] });
      }
    }
  }

  if (!series.length && !stationSeries.length) {
    host.appendChild(el("p", { class: "sub",
      text: "Nothing to plot for that window — no modelled values and no "
          + "measured station covers it." }));
    return;
  }

  const lg = el("div", { class: "legend" });
  for (const s of series) {
    const item = el("span", {}, el("span", { class: "dot" }), document.createTextNode(s.name));
    item.querySelector(".dot").style.background = SERIES[slotOf.get(s.id) ?? 0];
    lg.appendChild(item);
  }
  host.appendChild(lg);
  if (field) {
    const box = el("input", { type: "checkbox" });
    box.checked = clim.stations;
    box.addEventListener("change", () => { clim.stations = box.checked; render(); });
    host.appendChild(el("label", { class: "hint",
      style: "display:flex;gap:0.35rem;align-items:center;margin:0.2rem 0 0.4rem;" },
      box, document.createTextNode(
        "Show measured weather stations — solid, against the dashed modelled line"
        + (picks.length === 1 ? "" : " (select one resort to see its older stations too)"))));
  }
  host.appendChild(climateChart(series, M, stationSeries));
  host.appendChild(decadeTable(series, M, stationSeries));
  if (stationSeries.length) host.appendChild(stationKey(stationSeries));
  host.appendChild(el("p", { class: "hint",
    text: (clim.metric === "freezing_m"
      ? "The freezing level is estimated, not observed: it is where 0 °C falls, from each "
        + "resort's summit temperature and a standard " + CLIM.lapse_c_per_km
        + " °C/km lapse rate. Above the summit height means it was above freezing on top. "
      : "")
      + "One week of weather is a noisy thing, so a trend is only worth reading where the "
      + "interval excludes zero — those are marked, and snow depth usually is not while "
      + "freezing level usually is." }));
  if (clim.metric === "snow_depth") host.appendChild(el("p", { class: "hint",
    text: "This is ERA5's modelled snowpack at each resort's summit height, which is what "
        + "35 years of reanalysis can give. It is not the upper and lower depths a resort "
        + "reports on its own snow page — those are scraped into this project too, but only "
        + "from February 2026 onwards, so they can answer what this season is doing and not "
        + "what three decades did. They are in the Scatter lab as “Snow depth (mountain)” "
        + "and “Snow depth (valley)”." }));
}

function climateChart(series, M, stationSeries = []) {
  const w = Math.max(620, ($("#view").clientWidth || 900) - 40), h = 380;
  const m = { l: 58, r: 16, t: 14, b: 46, w, h };
  const all = series.flatMap(s => s.pts).concat(stationSeries.flatMap(s => s.pts));
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const xDom = [Math.min(...xs), Math.max(...xs)];
  const yDom = domainOf(ys);
  // For one resort's freezing level, the summit is the number that gives the
  // rest meaning — how far the 0 °C line still sits below the top of the
  // mountain, and how fast it is climbing towards it. It is always above the
  // data, so the axis has to be stretched to it or the line never appears.
  const summit = (clim.metric === "freezing_m" && series.length === 1)
    ? series[0].top : null;
  if (summit && summit > yDom[1]) yDom[1] = summit * 1.02;
  const x = v => m.l + (v - xDom[0]) / ((xDom[1] - xDom[0]) || 1) * (w - m.l - m.r);
  const y = v => m.t + (1 - (v - yDom[0]) / ((yDom[1] - yDom[0]) || 1)) * (h - m.t - m.b);
  const svg = chartSvg(w, h);
  for (const v of niceTicks(yDom, 5)) {
    svg.appendChild(el("line", { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: GRID }));
    svg.appendChild(el("text", { x: m.l - 6, y: y(v) + 3, "text-anchor": "end",
      "font-size": 10, fill: MUTED, text: fmt(v, M.dp) }));
  }
  for (const v of niceTicks(xDom, 6))
    svg.appendChild(el("text", { x: x(v), y: h - 26, "text-anchor": "middle",
      "font-size": 10, fill: MUTED, text: seasonLabel(Math.round(v)) }));
  svg.appendChild(el("text", { x: 13, y: (m.t + h - m.b) / 2, "font-size": 11, fill: INK2,
    "text-anchor": "middle", transform: `rotate(-90 13 ${(m.t + h - m.b) / 2})`,
    text: M.label + (M.unit ? ` (${M.unit})` : "") }));

  if (summit) {
    svg.appendChild(el("line", { x1: m.l, x2: w - m.r, y1: y(summit), y2: y(summit),
      stroke: SERIES[1], "stroke-width": 1.5, "stroke-dasharray": "6 4" }));
    svg.appendChild(el("text", { x: w - m.r - 4, y: y(summit) - 5, "text-anchor": "end",
      "font-size": 10, fill: SERIES[1],
      text: series[0].name + " summit, " + summit + " m" }));
  }

  // Modelled first and underneath. When measured stations are present it is
  // drawn hollow and dashed, so the eye reads the solid lines as the
  // observations and this as the estimate it is.
  const hasMeasured = stationSeries.length > 0;
  for (const s of series) {
    const colour = SERIES[slotOf.get(s.id) ?? 0];
    const sorted = s.pts.slice().sort((a, b) => a.x - b.x);
    svg.appendChild(el("path", { fill: "none", stroke: colour, "stroke-width": 1.2,
      "stroke-opacity": hasMeasured ? 0.35 : 0.45,
      "stroke-dasharray": hasMeasured ? "4 3" : "",
      d: "M" + sorted.map(p => `${x(p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join("L") }));
    for (const p of sorted) {
      const c = el("circle", { cx: x(p.x).toFixed(1), cy: y(p.y).toFixed(1),
        r: hasMeasured ? 2.8 : 3.4,
        fill: hasMeasured ? SURF : colour, stroke: colour,
        "stroke-width": hasMeasured ? 1.4 : 1.2 });
      c.addEventListener("mousemove", e => showTip(
        `<div class="t-date">${s.name}</div>` +
        `<div class="t-sub">${seasonLabel(p.x)} · modelled (ERA5, summit)</div>` +
        `<table><tr><td>${M.label}</td><td>${fmt(p.y, M.dp)} ${M.unit}</td></tr>` +
        `<tr><td>Days averaged</td><td>${p.n}</td></tr></table>`, e.clientX, e.clientY));
      c.addEventListener("mouseleave", hideTip);
      svg.appendChild(c);
    }
    const t = trend(s.pts);
    if (t) svg.appendChild(el("line", { x1: x(xDom[0]), x2: x(xDom[1]),
      y1: y(t.slope * xDom[0] + t.intercept), y2: y(t.slope * xDom[1] + t.intercept),
      stroke: colour, "stroke-width": t.significant ? 2.6 : 1.6,
      "stroke-opacity": hasMeasured ? 0.4 : 1,
      "stroke-dasharray": t.significant ? "" : "5 4" }));
  }

  // Measured stations. Same hue as the resort — they are the same place — but
  // the primary station is solid and full strength while older, closed
  // stations are thinner and paler, so they read as related, not identical.
  for (const s of stationSeries) {
    const first = s.station.primary;
    const sorted = s.pts.slice().sort((a, b) => a.x - b.x);
    const op = first ? 1 : 0.5;
    svg.appendChild(el("path", { fill: "none", stroke: s.colour,
      "stroke-width": first ? 2 : 1.1, "stroke-opacity": op,
      "stroke-dasharray": first ? "" : "1 2",
      d: "M" + sorted.map(p => `${x(p.x).toFixed(1)},${y(p.y).toFixed(1)}`).join("L") }));
    for (const p of sorted) {
      const c = el("circle", { cx: x(p.x).toFixed(1), cy: y(p.y).toFixed(1),
        r: first ? 3.2 : 2, fill: s.colour, "fill-opacity": op,
        stroke: SURF, "stroke-width": 1 });
      c.addEventListener("mousemove", e => showTip(
        `<div class="t-date">${s.station.id.replace(/_/g, " ")}</div>` +
        `<div class="t-sub">${seasonLabel(p.x)} · measured · ` +
        `${s.station.elevation_m} m · ${s.station.cadence}` +
        `${first ? "" : " · older station"}</div>` +
        `<table><tr><td>${M.label}</td><td>${fmt(p.y, M.dp)} ${M.unit}</td></tr>` +
        `<tr><td>${s.station.cadence === "daily" ? "Days" : "Months"} averaged</td>` +
        `<td>${p.n}</td></tr>` +
        `<tr><td>From resort</td><td>${fmt(s.station.distance_km, 1)} km</td></tr>` +
        `</table>`, e.clientX, e.clientY));
      c.addEventListener("mouseleave", hideTip);
      svg.appendChild(c);
    }
  }
  return svg;
}

/* Which station is which, since the chart deliberately reuses the resort's
   colour for all of its sources. */
function stationKey(stationSeries) {
  const box = el("div", { class: "hint", style: "margin-top:0.4rem;" });
  box.appendChild(el("div", { text: "Measured stations, in order of preference:" }));
  for (const s of stationSeries) {
    const yrs = s.pts.map(p => p.x);
    const line = el("div", { style: "margin-left:0.6rem;" });
    const sw = el("span", { class: "sw" });
    sw.style.background = s.colour;
    sw.style.opacity = s.station.primary ? "1" : "0.5";
    line.appendChild(sw);
    line.appendChild(document.createTextNode(
      s.station.id.replace(/_/g, " ") + " — " + s.station.elevation_m + " m, "
      + fmt(s.station.distance_km, 1) + " km away, " + s.station.cadence
      + ", " + seasonLabel(Math.min(...yrs)) + " to " + seasonLabel(Math.max(...yrs))
      + (s.station.primary ? " (primary)" : " (older station, drawn faint)")));
    box.appendChild(line);
  }
  box.appendChild(el("div", { style: "margin-top:0.3rem;",
    text: "Separate stations are never joined into one line: they sit at "
        + "different heights, so a splice would invent a step change that looks "
        + "exactly like a climate signal. Monthly stations average whole months, "
        + "so their value covers more than the chosen window." }));
  return box;
}

function decadeTable(series, M, stationSeries = []) {
  const t = el("table", { class: "league" });
  t.appendChild(el("thead", {}, el("tr", {},
    el("th", { text: "series" }), el("th", { text: "first 10 seasons" }),
    el("th", { text: "last 10 seasons" }), el("th", { text: "change" }),
    el("th", { text: "trend per decade" }), el("th", { text: "95% interval" }))));
  const tb = el("tbody");
  // Only the primary measured station gets a row; the older ones are context
  // on the chart, not numbers to quote.
  const rows = series.map(s => ({ ...s, kind: "modelled",
      name: stationSeries.length ? s.name + " (modelled)" : s.name }))
    .concat(stationSeries.filter(s => s.station.primary).map(s => ({
      name: s.station.id.replace(/_/g, " ") + " (measured, "
            + s.station.elevation_m + " m)",
      pts: s.pts, kind: "measured" })));
  for (const s of rows) {
    const sorted = s.pts.slice().sort((a, b) => a.x - b.x);
    const mean = g => g.reduce((a, p) => a + p.y, 0) / g.length;
    const early = mean(sorted.slice(0, 10)), late = mean(sorted.slice(-10));
    const tr = trend(s.pts);
    const row = el("tr", {});
    row.appendChild(el("td", { text: s.name }));
    row.appendChild(el("td", { text: fmt(early, M.dp) + " " + M.unit }));
    row.appendChild(el("td", { text: fmt(late, M.dp) + " " + M.unit }));
    const diff = late - early;
    const dc = el("td", { text: (diff >= 0 ? "+" : "") + fmt(diff, M.dp) + " " + M.unit });
    if (M.better) dc.style.color =
      (diff > 0) === (M.better === "up") ? "var(--s3)" : "var(--s2)";
    row.appendChild(dc);
    row.appendChild(el("td", { text: tr ? (tr.slope * 10 >= 0 ? "+" : "")
      + fmt(tr.slope * 10, M.dp) + " " + M.unit : "—" }));
    row.appendChild(el("td", { text: tr
      ? fmt(tr.lo * 10, M.dp) + " to " + fmt(tr.hi * 10, M.dp)
        + (tr.significant ? "" : "  (includes zero)") : "—" }));
    tb.appendChild(row);
  }
  t.appendChild(tb);
  return t;
}

/* ---------- scatter lab ---------- */
/* Axes are the time-series metrics plus a few that only make sense against
   another variable: altitude is constant per resort, and the within-day drop
   is a wind-hold detector rather than a quantity anyone tracks over time. */
const AXES = Object.assign({}, METRICS, {
  alt:    { label: "Resort top altitude", unit: "m",    get: r => r.alt },
  wind:   { label: "Max wind speed",      unit: "km/h", get: r => r.wind },
  tmax:   { label: "Max temp",            unit: "°C",   get: r => r.tmax },
  snowv:  { label: "Snow depth (valley)", unit: "cm",   get: r => r.snow_val },
  precip: { label: "Precipitation",       unit: "mm",   get: r => r.precip },
  total:  { label: "Lifts in the resort", unit: "",     get: r => r.lifts_total },
  doy:    { label: "Days into the season", unit: "d",   get: r => daysIntoSeason(r.date) },
  drop:   { label: "Within-day drop",     unit: "pt",
            get: r => (r.error || r.pct == null || r.pctMin == null) ? null : r.pct - r.pctMin },
});
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DIMS = {
  none:    { label: "nothing" },
  resort:  { label: "resort", cat: r => r.name },
  country: { label: "country", cat: r => r.country },
  area:    { label: "area", cat: r => r.area },
  month:   { label: "month", cat: r => MONTHS[+r.date.slice(5, 7) - 1] },
  hol:     { label: "school holiday", cat: r => r.hol ? "holiday" : "term time" },
  band:    { label: "wind band", cat: r => r.gust == null ? null : bandOf(Number(r.gust)) },
  altn:    { label: "top altitude", num: r => r.alt, unit: "m" },
  gustn:   { label: "wind gust", num: r => r.gust == null ? null : Number(r.gust), unit: "km/h" },
  freshn:  { label: "fresh snow", num: r => r.fresh == null ? null : Number(r.fresh), unit: "cm" },
};
let lab = { x: "gust", y: "pct", colour: "country", size: "none",
            facet: "none", trend: "bins", selOnly: false, core: false };

function daysIntoSeason(d) {
  const y = +d.slice(0, 4), m = +d.slice(5, 7);
  const start = Date.UTC(m >= 8 ? y : y - 1, 10, 1);   // 1 November
  return Math.round((Date.parse(d) - start) / 86400000);
}
/* Least squares, plus the r² that says whether the line deserves attention. */
function fitLine(pts) {
  const n = pts.length;
  if (n < 3) return null;
  let sx = 0, sy = 0, sxy = 0, sxx = 0, syy = 0;
  for (const p of pts) { sx += p.x; sy += p.y; sxy += p.x * p.y; sxx += p.x * p.x; syy += p.y * p.y; }
  const den = n * sxx - sx * sx;
  if (!den) return null;
  const slope = (n * sxy - sx * sy) / den, intercept = (sy - slope * sx) / n;
  const denR = Math.sqrt(den * (n * syy - sy * sy));
  const r = denR ? (n * sxy - sx * sy) / denR : 0;
  return { slope, intercept, r2: r * r, n };
}
function binMeans(pts, dom, nbins = 8) {
  const out = [];
  for (let i = 0; i < nbins; i++) {
    const lo = dom[0] + (dom[1] - dom[0]) * i / nbins;
    const hi = dom[0] + (dom[1] - dom[0]) * (i + 1) / nbins;
    const inBin = pts.filter(p => p.x >= lo && (i === nbins - 1 ? p.x <= hi : p.x < hi));
    if (inBin.length < 3) continue;
    const mean = inBin.reduce((a, p) => a + p.y, 0) / inBin.length;
    const sd = Math.sqrt(inBin.reduce((a, p) => a + (p.y - mean) ** 2, 0) / inBin.length);
    out.push({ mid: (lo + hi) / 2, mean, sd, n: inBin.length });
  }
  return out;
}
/* Round tick values, so an axis reads 0/25/50 rather than 5.8/28/53. */
function niceTicks(dom, count) {
  const raw = (dom[1] - dom[0]) / count;
  if (!(raw > 0)) return dom;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(v => v >= raw) || 10 * p;
  const out = [];
  for (let v = Math.ceil(dom[0] / step) * step; v <= dom[1] + step / 1e6; v += step)
    out.push(Math.round(v / step) * step);
  return out;
}
/* Several labels already carry their unit ("% lifts open"); don't repeat it. */
function axisTitle(k) {
  const a = AXES[k];
  return a.unit && !a.label.includes(a.unit) ? `${a.label} (${a.unit})` : a.label;
}
function domainOf(vals) {
  const lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) return [lo - 1, hi + 1];
  const pad = (hi - lo) * 0.04;
  return [lo - pad, hi + pad];
}

function labPoints() {
  const gx = AXES[lab.x].get, gy = AXES[lab.y].get;
  const sized = lab.size !== "none" ? DIMS[lab.size] : null;
  const pts = [];
  for (const r of ROWS) {
    if (!inRange(r)) continue;
    if (lab.core && !inCoreSeason(r.date)) continue;
    if (lab.selOnly && selection.length && !selection.includes(r.id)) continue;
    const x = gx(r), y = gy(r);
    if (x == null || y == null) continue;
    pts.push({ r, x: Number(x), y: Number(y),
               s: sized ? (sized.num ? sized.num(r) : null) : null });
  }
  return pts;
}

function renderScatter(host) {
  if ((lab.colour === "band" || lab.core) && !MODEL) {
    host.appendChild(el("p", { class: "sub", text: "Fetching the wind bands…" }));
    loadModel().then(d => { MODEL = d; render(); });
    return;
  }
  host.appendChild(el("h2", { text: "Scatter lab" }));
  host.appendChild(el("p", { class: "sub",
    text: "Put any measurement against any other, for every resort-day in the chosen "
        + "range. Colour, size and small multiples are there to find the grouping that "
        + "makes a pattern obvious. Outside the core season resorts wind down for reasons "
        + "that have nothing to do with the weather, which flattens most weather trends "
        + "to nothing — the core-season box is usually the first thing to tick." }));

  const ctl = el("div", { class: "controls", style: "margin-bottom:0.8rem;" });
  const sel = (key, opts, labelText) => {
    const s = el("select", { onchange: e => { lab[key] = e.target.value; render(); } });
    for (const [v, t] of opts) {
      const o = el("option", { value: v, text: t });
      if (lab[key] === v) o.setAttribute("selected", "");
      s.appendChild(o);
    }
    ctl.appendChild(el("div", { class: "group" }, el("label", { text: labelText }), s));
  };
  const axisOpts = Object.entries(AXES).map(([k, v]) => [k, v.label]);
  const dimOpts = Object.entries(DIMS).map(([k, v]) => [k, v.label]);
  sel("x", axisOpts, "X:");
  sel("y", axisOpts, "Y:");
  sel("colour", dimOpts, "Colour:");
  sel("size", dimOpts.filter(([k]) => k === "none" || DIMS[k].num), "Size:");
  sel("facet", dimOpts.filter(([k]) => k === "none" || DIMS[k].cat), "Split into:");
  sel("trend", [["none", "nothing"], ["bins", "binned mean ±1 SD"],
                ["line", "line of best fit"]], "Trend:");
  const check = (key, text) => {
    const box = el("input", { type: "checkbox" });
    box.checked = lab[key];
    box.addEventListener("change", () => { lab[key] = box.checked; render(); });
    ctl.appendChild(el("label",
      { style: "display:flex;gap:0.3rem;align-items:center;color:var(--ink-2);" },
      box, document.createTextNode(text)));
  };
  check("selOnly", "selected resorts only");
  check("core", "core season only");
  host.appendChild(ctl);

  const pts = labPoints();
  if (pts.length < 2) {
    host.appendChild(el("p", { class: "sub",
      text: "Nothing to plot — those two measurements never appear on the same day. "
          + "Widen the range or pick another pair." }));
    return;
  }
  const xDom = domainOf(pts.map(p => p.x)), yDom = domainOf(pts.map(p => p.y));
  if (AXES[lab.x].dom) xDom.splice(0, 2, ...AXES[lab.x].dom);
  if (AXES[lab.y].dom) yDom.splice(0, 2, ...AXES[lab.y].dom);
  const colour = colourFn(pts);
  const sizeFn = sizeScale(pts);

  if (lab.facet === "none") {
    const w = Math.max(620, ($("#view").clientWidth || 900) - 40);
    host.appendChild(colour.legend());
    host.appendChild(scatterSvg(pts, xDom, yDom, w, 460, colour, sizeFn, true));
  } else {
    const key = DIMS[lab.facet].cat;
    const groups = new Map();
    for (const p of pts) {
      const k = key(p.r) || "—";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(p);
    }
    const ordered = [...groups.entries()].sort((a, b) => b[1].length - a[1].length);
    host.appendChild(colour.legend());
    host.appendChild(el("p", { class: "hint",
      text: "All panels share the same axes, so they can be read against each other." }));
    const grid = el("div", { class: "facets" });
    for (const [k, gp] of ordered) {
      const cell = el("div", { class: "facet" });
      cell.appendChild(el("div", { class: "facet-t",
        text: k + "  (" + gp.length + ")" }));
      cell.appendChild(scatterSvg(gp, xDom, yDom, 300, 200, colour, sizeFn, false));
      grid.appendChild(cell);
    }
    host.appendChild(grid);
  }

  const fit = fitLine(pts);
  host.appendChild(el("p", { class: "hint",
    text: pts.length + " resort-days plotted"
        + (fit ? `. Across everything shown, ${AXES[lab.y].label.toLowerCase()} changes by `
               + fmt(fit.slope, 2) + " per unit of " + AXES[lab.x].label.toLowerCase()
               + " (r² = " + fmt(fit.r2, 2) + ")." : ".")
        + " r² near zero means the line is decoration; a pattern hiding inside one group "
        + "will show up under “Split into” long before it shows up here." }));
  host.appendChild(csvLink(pts));
}

/* Colours: up to eight categories get their own, a numeric dimension gets the
   sequential ramp, and anything with more categories than colours keeps its
   biggest eight and greys out the tail rather than recycling hues. */
function colourFn(pts) {
  const d = DIMS[lab.colour];
  if (!d || lab.colour === "none")
    return { of: () => SERIES[0], legend: () => el("div") };
  if (d.num) {
    const vals = pts.map(p => d.num(p.r)).filter(v => v != null).map(Number);
    if (!vals.length) return { of: () => BASE, legend: () => el("div") };
    const lo = Math.min(...vals), hi = Math.max(...vals);
    return {
      of: p => { const v = d.num(p.r);
        return v == null ? GRID : SEQ[Math.round((Number(v) - lo) / ((hi - lo) || 1) * (SEQ.length - 1))]; },
      legend: () => {
        const row = el("div", { class: "legend-row" });
        row.appendChild(el("span", { text: d.label + ":" }));
        row.appendChild(el("span", { text: fmt(lo) + (d.unit ? " " + d.unit : "") }));
        const ramp = el("span", { class: "ramp" });
        for (const c of SEQ) { const i = el("i"); i.style.background = c; ramp.appendChild(i); }
        row.appendChild(ramp);
        row.appendChild(el("span", { text: fmt(hi) + (d.unit ? " " + d.unit : "") }));
        return row;
      },
    };
  }
  const counts = new Map();
  for (const p of pts) {
    const k = d.cat(p.r);
    if (k != null) counts.set(k, (counts.get(k) || 0) + 1);
  }
  const top = [...counts.entries()].sort((a, b) => b[1] - a[1])
    .slice(0, SERIES.length).map(e => e[0]);
  const idx = new Map(top.map((k, i) => [k, i]));
  const spare = counts.size > top.length;
  return {
    of: p => { const k = d.cat(p.r);
      return idx.has(k) ? SERIES[idx.get(k)] : BASE; },
    legend: () => {
      const row = el("div", { class: "legend" });
      for (const k of top) {
        const s = el("span", {}, el("span", { class: "dot" }), document.createTextNode(k));
        s.querySelector(".dot").style.background = SERIES[idx.get(k)];
        row.appendChild(s);
      }
      if (spare) {
        const s = el("span", {}, el("span", { class: "dot" }),
          document.createTextNode("everything else (" + (counts.size - top.length) + " more)"));
        s.querySelector(".dot").style.background = BASE;
        row.appendChild(s);
      }
      return row;
    },
  };
}
function sizeScale(pts) {
  if (lab.size === "none") return () => 4;
  const vals = pts.map(p => p.s).filter(v => v != null).map(Number);
  if (!vals.length) return () => 4;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  return p => p.s == null ? 2.5
    : 2.5 + 6 * Math.sqrt((Number(p.s) - lo) / ((hi - lo) || 1));
}

function scatterSvg(pts, xDom, yDom, w, h, colour, sizeFn, big) {
  const m = { l: big ? 52 : 34, r: 14, t: 12, b: big ? 42 : 26, w, h };
  const x = v => m.l + (v - xDom[0]) / (xDom[1] - xDom[0]) * (w - m.l - m.r);
  const y = v => m.t + (1 - (v - yDom[0]) / (yDom[1] - yDom[0])) * (h - m.t - m.b);
  const svg = chartSvg(w, h);
  const nt = big ? 5 : 3;
  const dp = d => Math.abs(d) < 10 ? 1 : 0;
  for (const v of niceTicks(yDom, nt)) {
    const yy = y(v);
    svg.appendChild(el("line", { x1: m.l, x2: w - m.r, y1: yy, y2: yy, stroke: GRID }));
    svg.appendChild(el("text", { x: m.l - 5, y: yy + 3, "text-anchor": "end",
      "font-size": big ? 10 : 8, fill: MUTED, text: fmt(v, dp(yDom[1] - yDom[0])) }));
  }
  for (const v of niceTicks(xDom, nt))
    svg.appendChild(el("text", { x: x(v), y: h - (big ? 24 : 8), "text-anchor": "middle",
      "font-size": big ? 10 : 8, fill: MUTED, text: fmt(v, dp(xDom[1] - xDom[0])) }));
  if (big) {
    svg.appendChild(el("text", { x: (m.l + w - m.r) / 2, y: h - 6, "text-anchor": "middle",
      "font-size": 11, fill: INK2,
      text: axisTitle(lab.x) }));
    svg.appendChild(el("text", { x: 12, y: (m.t + h - m.b) / 2, "font-size": 11, fill: INK2,
      "text-anchor": "middle", transform: `rotate(-90 12 ${(m.t + h - m.b) / 2})`,
      text: axisTitle(lab.y) }));
  }
  // Opacity falls as the cloud thickens, so dense regions read as dense
  // rather than as one solid block of colour.
  const op = Math.max(0.25, Math.min(0.8, 90 / Math.sqrt(pts.length * 40)));
  for (const p of pts) {
    const c = el("circle", { cx: x(p.x).toFixed(1), cy: y(p.y).toFixed(1),
      r: (big ? 1 : 0.62) * sizeFn(p), fill: colour.of(p), "fill-opacity": op,
      stroke: SURF, "stroke-width": big ? 1 : 0.4 });
    c.addEventListener("mousemove", e => showTip(
      `<div class="t-date">${p.r.name}</div><div class="t-sub">${p.r.date}</div><table>` +
      `<tr><td>${AXES[lab.x].label}</td><td>${fmt(p.x, 1)} ${AXES[lab.x].unit}</td></tr>` +
      `<tr><td>${AXES[lab.y].label}</td><td>${fmt(p.y, 1)} ${AXES[lab.y].unit}</td></tr>` +
      (p.r.pct != null ? `<tr><td>Lifts</td><td>${p.r.lifts_open}/${p.r.lifts_total}</td></tr>` : "") +
      `</table>`, e.clientX, e.clientY));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
  }
  if (lab.trend === "line") {
    const f = fitLine(pts);
    if (f) svg.appendChild(el("line", { x1: x(xDom[0]), x2: x(xDom[1]),
      y1: y(f.slope * xDom[0] + f.intercept), y2: y(f.slope * xDom[1] + f.intercept),
      stroke: INK, "stroke-width": big ? 2 : 1.2, "stroke-opacity": 0.75 }));
  } else if (lab.trend === "bins") {
    const bins = binMeans(pts, xDom);
    if (bins.length > 1) {
      const band = bins.map(b => `${x(b.mid).toFixed(1)},${y(b.mean + b.sd).toFixed(1)}`)
        .concat(bins.slice().reverse()
          .map(b => `${x(b.mid).toFixed(1)},${y(b.mean - b.sd).toFixed(1)}`));
      svg.appendChild(el("path", { d: "M" + band.join("L") + "Z", fill: INK,
        "fill-opacity": 0.08 }));
      svg.appendChild(el("path", { fill: "none", stroke: INK,
        "stroke-width": big ? 2.2 : 1.4, "stroke-opacity": 0.8,
        d: "M" + bins.map(b => `${x(b.mid).toFixed(1)},${y(b.mean).toFixed(1)}`).join("L") }));
    }
  }
  return svg;
}

function csvLink(pts) {
  const head = ["resort", "date", "country", "area",
                AXES[lab.x].label, AXES[lab.y].label];
  const body = pts.map(p => [p.r.name, p.r.date, p.r.country, p.r.area || "", p.x, p.y]
    .map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(","));
  const url = URL.createObjectURL(
    new Blob([[head.join(","), ...body].join("\n")], { type: "text/csv" }));
  const a = el("a", { href: url, download: `${lab.x}-vs-${lab.y}.csv`,
    class: "hint", style: "display:inline-block;margin-top:0.3rem;color:#2b6cb0;",
    text: "Download this slice as CSV" });
  return a;
}

/* ---------- how the model works ---------- */
let MODEL = null, modelPromise = null, modelResort = null;
/* Cells the ordering got wrong, split by which way it was wrong: amber ran
   when the order said it should be shut, red shut while the order said run. */
const OK_OPEN = "#86b6ef", OK_SHUT = "#eceae4", ERR_RAN = "#eda100", ERR_SHUT = "#e34948";

function loadModel() {
  if (!modelPromise) modelPromise = fetch("/api/model.json").then(r => r.json());
  return modelPromise;
}
function inCoreSeason(dstr) {
  const md = dstr.slice(5), [a, b] = MODEL.core_season;
  return md >= a || md <= b;
}
function bandOf(g) {
  for (const b of MODEL.bins) if (g < b.upper) return b.name;
  return MODEL.bins[MODEL.bins.length - 1].name;
}
function stat(label, value, note) {
  return el("div", { class: "stat" },
    el("div", { class: "stat-v", text: value }),
    el("div", { class: "stat-l", text: label }),
    note ? el("div", { class: "stat-n", text: note }) : null);
}

function renderModel(host) {
  if (!MODEL) {
    host.appendChild(el("p", { class: "sub", text: "Working out the model…" }));
    loadModel().then(d => { MODEL = d; render(); })
               .catch(e => { host.innerHTML = ""; host.appendChild(
                 el("p", { class: "sub", text: "Could not load the model: " + e.message })); });
    return;
  }
  const ids = Object.keys(MODEL.resorts)
    .sort((a, b) => MODEL.resorts[b].fit.cs - MODEL.resorts[a].fit.cs);
  if (!ids.length) { host.appendChild(el("p", { class: "sub",
    text: "No resort has enough per-lift readings yet." })); return; }
  if (!ids.includes(modelResort)) modelResort = ids.includes("cervinia") ? "cervinia" : ids[0];
  const R = MODEL.resorts[modelResort];

  host.appendChild(el("h2", { text: "How the model works" }));
  host.appendChild(el("p", { class: "sub",
    text: "Two layers. The first turns weather into a share of the mountain still running. "
        + "The second turns that share into named lifts, by assuming each resort shuts its "
        + "lifts in a consistent order. Everything below is measured on the "
        + MODEL.core_season[0] + " to " + MODEL.core_season[1] + " core season only." }));

  const pick = el("select", { onchange: e => { modelResort = e.target.value; render(); } });
  for (const id of ids) {
    const o = el("option", { value: id, text: MODEL.resorts[id].name
      + " — " + MODEL.resorts[id].verdict });
    if (id === modelResort) o.setAttribute("selected", "");
    pick.appendChild(o);
  }
  const ctl = el("div", { class: "controls", style: "margin-bottom:0.9rem;" },
    el("div", { class: "group" }, el("label", { text: "Resort:" }), pick));
  host.appendChild(ctl);

  renderScorecard(host, R);
  renderDoseResponse(host, R);
  renderScalogram(host, R);
  renderLadder(host, R);
  renderCrosswind(host, R);
  renderModelTable(host, ids);
}

function renderScorecard(host, R) {
  const f = R.fit, h = R.holdout, t = MODEL.thresholds;
  const box = el("div", { class: "stats" },
    stat("reproducibility (CR)", fmt(100 * f.cr, 1) + "%",
         "baseline " + fmt(100 * f.mmr, 1) + "%"),
    stat("scalability (CS)", fmt(f.cs, 3),
         "nested needs " + fmt(t.cs, 2)),
    stat("CS on held-out days", h ? fmt(h.cs, 3) : "—",
         h ? "days the order never saw" : "not enough days"),
    stat("closures to learn from", fmt(f.pct_closed, 1) + "%",
         f.mixed_snaps + " partly-open snapshots"));
  host.appendChild(box);
  const thin = f.mixed_snaps < MODEL.thresholds.mixed;
  host.appendChild(el("p", { class: "hint",
    text: "Verdict: " + R.verdict + ". Read CS, not CR — CR is above 95% for every resort "
        + "including the ones that fail, because most lifts are open most of the time and "
        + "“predict open for everything” already scores that well. CS is how much of the "
        + "remaining headroom the ordering captures."
        + (thin ? " This resort is marked thin: only a partly-open snapshot tests an ordering "
                + "at all, and there are fewer than " + MODEL.thresholds.mixed + " of them." : "") }));
}

function renderDoseResponse(host, R) {
  host.appendChild(el("h3", { text: "Layer 1 — how much of the mountain survives the wind" }));
  host.appendChild(el("p", { class: "sub",
    text: "One point per day. The step line is the model's estimate for each wind band, "
        + "pulled toward the all-resort average where the band is thin; the dashed line is "
        + "that all-resort average." }));

  const pts = [...(byResort.get(modelResort) || new Map()).values()]
    .filter(r => !r.error && r.gust != null && r.pct != null && inCoreSeason(r.date));
  const w = Math.max(620, ($("#view").clientWidth || 900) - 40), h = 340;
  const m = { l: 46, r: 16, t: 26, b: 42, w, h };
  // Round to the next 20 rather than niceMax: gusts stop around 120, and
  // niceMax would round that to 200 and leave half the chart empty.
  const maxG = Math.max(100, Math.ceil(Math.max(...pts.map(p => Number(p.gust)), 0) / 20) * 20);
  const x = v => m.l + Math.min(v, maxG) / maxG * (w - m.l - m.r);
  const y = v => m.t + (1 - v / 100) * (h - m.t - m.b);
  const svg = chartSvg(w, h);

  // Band shading, alternating so the four bands read as zones rather than ticks.
  let lo = 0;
  MODEL.bins.forEach((b, i) => {
    const hi = Math.min(b.upper, maxG);
    if (hi > lo) {
      if (i % 2) svg.appendChild(el("rect", { x: x(lo), y: m.t, width: x(hi) - x(lo),
        height: h - m.t - m.b, fill: WASH }));
      svg.appendChild(el("text", { x: (x(lo) + x(hi)) / 2, y: m.t - 10,
        "text-anchor": "middle", "font-size": 10, fill: MUTED, text: b.name }));
    }
    lo = b.upper;
  });
  axisLeft(svg, y, [0, 100], m, "%");
  for (let g = 0; g <= maxG; g += maxG / 5)
    svg.appendChild(el("text", { x: x(g), y: h - 24, "text-anchor": "middle",
      "font-size": 10, fill: MUTED, text: fmt(g) }));
  svg.appendChild(el("text", { x: (m.l + w - m.r) / 2, y: h - 8, "text-anchor": "middle",
    "font-size": 11, fill: INK2, text: "Daily max wind gust (km/h)" }));

  for (const p of pts) {
    const c = el("circle", { cx: x(Number(p.gust)).toFixed(1), cy: y(Number(p.pct)).toFixed(1),
      r: 4, fill: SERIES[0], "fill-opacity": 0.55, stroke: SURF, "stroke-width": 1.5 });
    c.addEventListener("mousemove", e => showTip(
      `<div class="t-date">${p.date}</div>` +
      `<table><tr><td>Lifts</td><td>${p.lifts_open}/${p.lifts_total} (${fmt(p.pct)}%)</td></tr>` +
      `<tr><td>Gust</td><td>${fmt(p.gust)} km/h</td></tr>` +
      `<tr><td>Band</td><td>${bandOf(Number(p.gust))}</td></tr></table>`, e.clientX, e.clientY));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
  }

  // Step lines last so they sit above the cloud.
  const step = (get, colour, dash) => {
    let lo = 0;
    for (const b of MODEL.bins) {
      const hi = Math.min(b.upper, maxG), v = get(b.name);
      if (hi <= lo || v == null) { lo = b.upper; continue; }
      svg.appendChild(el("line", { x1: x(lo), x2: x(hi), y1: y(v), y2: y(v),
        stroke: colour, "stroke-width": 2.5, "stroke-dasharray": dash || "" }));
      lo = b.upper;
    }
  };
  step(b => MODEL.pooled[b]?.pct_open, BASE, "5 4");
  step(b => R.response[b]?.pct_open, SERIES[1]);
  host.appendChild(svg);

  const rows = MODEL.bins.map(b => R.response[b.name] ? { band: b.name, ...R.response[b.name] } : null)
    .filter(Boolean);
  const t = el("table", { class: "league" });
  t.appendChild(el("thead", {}, el("tr", {},
    el("th", { text: "wind band" }), el("th", { text: "days seen" }),
    el("th", { text: "est. % open" }), el("th", { text: "lost-day rate" }))));
  const tb = el("tbody");
  for (const r of rows)
    tb.appendChild(el("tr", {},
      el("td", { text: r.band + (r.shrunk ? " (thin)" : "") }),
      el("td", { text: String(r.n) }),
      el("td", { text: fmt(r.pct_open, 1) + "%" }),
      el("td", { text: fmt(100 * r.p_lost, 0) + "%" })));
  t.appendChild(tb);
  host.appendChild(t);
  host.appendChild(el("p", { class: "hint",
    text: "A lost day means under half the lifts running. “Thin” marks a band with too few "
        + "observed days to stand on its own, so its estimate has been pulled toward the average." }));
}

function renderScalogram(host, R) {
  host.appendChild(el("h3", { text: "Layer 2 — does the resort shut its lifts in a fixed order?" }));
  host.appendChild(el("p", { class: "sub",
    text: "Every snapshot is a row, fullest mountain at the top; every lift is a column, "
        + "first-to-shut on the left. The black line is the model's only prediction: knowing "
        + "how many lifts ran, it says which ones. A perfectly nested resort is a clean "
        + "staircase with nothing on the wrong side of the line." }));

  const lifts = R.ladder.map(l => l.name);
  const rows = R.scalogram;
  const avail = Math.max(560, ($("#view").clientWidth || 900) - 40);
  const labelW = 62, nameH = 108;
  const cw = Math.max(4, Math.min(16, Math.floor((avail - labelW - 8) / lifts.length)));
  const ch = Math.max(4, Math.min(13, Math.floor(620 / rows.length)));
  const w = labelW + cw * lifts.length + 8, h = nameH + ch * rows.length + 6;
  const svg = chartSvg(w, h);

  if (cw >= 7) {
    lifts.forEach((name, i) => {
      const cx = labelW + i * cw + cw / 2;
      svg.appendChild(el("text", { x: cx, y: nameH - 6, "font-size": Math.min(10, cw + 1),
        fill: R.ladder[i].link ? SERIES[1] : MUTED, "text-anchor": "start",
        transform: `rotate(-90 ${cx} ${nameH - 6})`,
        text: (name.length > 20 ? name.slice(0, 19) + "…" : name) }));
    });
  }

  rows.forEach((row, ri) => {
    const yTop = nameH + ri * ch;
    if (ch >= 9)
      svg.appendChild(el("text", { x: labelW - 6, y: yTop + ch - 2, "text-anchor": "end",
        "font-size": 9, fill: MUTED, text: row.date.slice(5) }));
    // Predicted open = the row's k most reliable *present* lifts, so absent
    // readings are skipped rather than counted against the ordering.
    const present = [];
    for (let i = 0; i < lifts.length; i++) {
      if (row.cells[i] !== "-") { present.push(i); continue; }
      // No reading. An empty hole would read as "shut", so outline it instead.
      svg.appendChild(el("rect", { x: labelW + i * cw, y: yTop, width: cw - 1,
        height: ch - 1, rx: 1, fill: SURF, stroke: GRID, "stroke-width": 0.7 }));
    }
    const firstOpen = present.length - row.open;
    let frontierX = labelW + cw * lifts.length;
    present.forEach((ci, pi) => {
      const isOpen = row.cells[ci] === "o", predOpen = pi >= firstOpen;
      if (pi === firstOpen) frontierX = labelW + ci * cw;
      const fill = isOpen === predOpen ? (isOpen ? OK_OPEN : OK_SHUT)
                                       : (isOpen ? ERR_RAN : ERR_SHUT);
      const rect = el("rect", { x: labelW + ci * cw, y: yTop, width: cw - 1, height: ch - 1,
        rx: 1, fill });
      rect.addEventListener("mousemove", e => showTip(
        `<div class="t-date">${lifts[ci]}</div><div class="t-sub">${row.date}</div>` +
        `<table><tr><td>Observed</td><td>${isOpen ? "running" : "shut"}</td></tr>` +
        `<tr><td>Order says</td><td>${predOpen ? "running" : "shut"}</td></tr>` +
        `<tr><td>Mountain</td><td>${row.open}/${row.seen} lifts open</td></tr></table>`,
        e.clientX, e.clientY));
      rect.addEventListener("mouseleave", hideTip);
      svg.appendChild(rect);
    });
    svg.appendChild(el("line", { x1: frontierX, x2: frontierX, y1: yTop, y2: yTop + ch,
      stroke: INK, "stroke-width": 1.2 }));
  });
  // Join the per-row frontiers into one staircase.
  let prevX = null;
  rows.forEach((row, ri) => {
    const present = [];
    for (let i = 0; i < lifts.length; i++) if (row.cells[i] !== "-") present.push(i);
    const firstOpen = present.length - row.open;
    const fx = firstOpen >= present.length ? labelW + cw * lifts.length
                                           : labelW + present[firstOpen] * cw;
    if (prevX != null && fx !== prevX)
      svg.appendChild(el("line", { x1: prevX, x2: fx, y1: nameH + ri * ch,
        y2: nameH + ri * ch, stroke: INK, "stroke-width": 1.2 }));
    prevX = fx;
  });
  host.appendChild(el("div", { class: "hm-scroll" }, svg));

  const lg = el("div", { class: "legend-row" });
  const key = (colour, label) => {
    const s = el("span", {}, el("span", { class: "sw" }), document.createTextNode(label));
    s.querySelector(".sw").style.background = colour;
    s.querySelector(".sw").style.boxShadow = "inset 0 0 0 1px rgba(11,11,11,0.12)";
    return s;
  };
  lg.appendChild(key(OK_OPEN, "ran, as the order predicts"));
  lg.appendChild(key(OK_SHUT, "shut, as the order predicts"));
  lg.appendChild(key(ERR_RAN, "ran when the order said shut"));
  lg.appendChild(key(ERR_SHUT, "shut when the order said run"));
  host.appendChild(lg);
  host.appendChild(el("p", { class: "hint",
    text: R.fit.errors + " of " + R.fit.cells + " cells are on the wrong side of the line. "
        + "Link lifts are named in orange. Rows where the whole mountain ran are free marks — "
        + "they are why CR flatters every resort and why CS is the number to read." }));
}

function renderLadder(host, R) {
  host.appendChild(el("h3", { text: "The closure ladder" }));
  host.appendChild(el("p", { class: "sub",
    text: "The order itself: first to shut at the top. Bearings come from OpenStreetMap — "
        + "if the lifts at the top share an orientation, this ordering is really a crosswind "
        + "effect in disguise, which is the next thing to build." }));
  const host2 = el("div");
  for (const l of R.ladder) {
    const row = el("div", { class: "lift-row" });
    const nm = el("div", { class: "lift-name", text: l.name });
    if (l.link) nm.appendChild(el("span", { class: "badge", text: "LINK" }));
    row.appendChild(nm);
    const track = el("div", { class: "lift-track" });
    const fill = el("div", { class: "lift-fill" });
    fill.style.width = l.open + "%";
    fill.style.background = seqColor(l.open);
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", { class: "lift-val", text: fmt(l.open, 0) + "%" }));
    row.appendChild(el("div", { class: "lift-val", style: "width:56px;",
      text: l.errs ? l.errs + " off" : "" }));
    const bear = el("div", { class: "lift-val", style: "width:74px;" });
    if (l.bearing != null) {
      const s = el("svg", { width: 14, height: 14, viewBox: "0 0 14 14",
        style: "vertical-align:-2px;margin-right:4px;" });
      s.appendChild(el("path", { d: "M7 1 L11 12 L7 9.4 L3 12 Z", fill: INK2,
        transform: `rotate(${l.bearing} 7 7)` }));
      bear.appendChild(s);
      bear.appendChild(document.createTextNode(fmt(l.bearing, 0) + "°"));
    } else {
      bear.textContent = "—";
    }
    row.appendChild(bear);
    host2.appendChild(row);
  }
  host.appendChild(host2);
  const known = R.ladder.filter(l => l.bearing != null).length;
  host.appendChild(el("p", { class: "hint",
    text: known + " of " + R.ladder.length + " lifts are matched to OpenStreetMap geometry; "
        + "the rest have no bearing yet. “off” counts the snapshots where that lift was on the "
        + "wrong side of the line." }));
}

/* The crosswind hypothesis, and its disproof. Kept visible rather than quietly
   dropped: the project leaned on it for months, and a reader deserves to see
   the test that retired it as much as the ones that passed. */
function renderCrosswind(host, R) {
  const g = MODEL.crosswind, cw = R.crosswind || {};
  host.appendChild(el("h3", { text: "What was tried and rejected: wind direction" }));
  host.appendChild(el("p", { class: "sub",
    text: "This was the project's central mechanism for a year, and it does not survive "
        + "contact with the data. It is left here rather than quietly removed, because a "
        + "model is only as trustworthy as the things it admits it got wrong." }));
  host.appendChild(el("p", { class: "sub",
    text: "A cable car should shut when the wind blows across it rather than along it, so "
        + "every lift's bearing was matched to OpenStreetMap and set against the day's wind "
        + "direction. Holding gust strength roughly fixed — each resort's windiest "
        + Math.round(100 - g.windy_quantile * 100) + "% of days — the angle across the cable "
        + "separates shut from running with an AUC of " + fmt(g.angle_auc, 3) + " over "
        + g.windy_pairs + " pairs. 0.5 is a coin flip. " + g.lifts_above_half + " of "
        + g.lifts_tested + " lifts land above it and " + (g.lifts_tested - g.lifts_above_half)
        + " below." }));

  const s = cw.summary;
  if (s) {
    host.appendChild(el("div", { class: "stats" },
      stat("gust alone (AUC)", fmt(s.auc_gust, 3), "this resort, within lift"),
      stat("crosswind (AUC)", fmt(s.auc_cross, 3),
           fmt(s.delta, 3) + " against gust"),
      stat("angle alone, windy days", s.auc_frac_windy == null ? "—" : fmt(s.auc_frac_windy, 3),
           "strength held fixed"),
      stat("lifts with a bearing", String(s.lifts),
           s.better + " improve on gust")));
  }

  const rose = cw.rose || [];
  if (rose.length) {
    host.appendChild(el("p", { class: "sub", style: "margin-top:0.6rem;",
      text: "Closure rate by the direction the wind came from. Petal length is the share of "
          + "readings shut on the resort's windy days; petal width shows how many separate "
          + "days the sector rests on — which is the point. One season spreads roughly fifty "
          + "days across twelve sectors, so the boldest-looking petals are often three days." }));
    host.appendChild(roseSvg(rose, g.sector_deg));
  }

  const lifts = cw.lifts || [];
  if (lifts.length) {
    const t = el("table", { class: "league" });
    t.appendChild(el("thead", {}, el("tr", {},
      el("th", { text: "lift" }), el("th", { text: "bearing" }),
      el("th", { text: "shut" }), el("th", { text: "AUC gust" }),
      el("th", { text: "AUC crosswind" }), el("th", { text: "angle alone" }))));
    const tb = el("tbody");
    for (const l of lifts.slice().sort((a, b) => b.delta - a.delta)) {
      const tr = el("tr", {});
      const nm = el("td", { text: l.name });
      if (l.link) nm.appendChild(el("span", { class: "badge", text: "LINK" }));
      tr.appendChild(nm);
      tr.appendChild(el("td", { text: fmt(l.bearing, 0) + "° " + compass(l.bearing) }));
      tr.appendChild(el("td", { text: String(l.shut) }));
      tr.appendChild(el("td", { text: fmt(l.auc_gust, 2) }));
      tr.appendChild(el("td", { text: fmt(l.auc_cross, 2) }));
      tr.appendChild(el("td", { text: l.auc_frac_windy == null ? "—"
                                    : fmt(l.auc_frac_windy, 2) }));
      tb.appendChild(tr);
    }
    t.appendChild(tb);
    host.appendChild(t);
  }
  host.appendChild(el("p", { class: "hint",
    text: "There are two honest readings and this data cannot separate them. The first is "
        + "that real mountains are messier than the theory: a cable does not stand in a wind "
        + "tunnel, it runs through gullies, past shoulders and above trees, all of which bend "
        + "and shelter the flow long before it reaches the towers. On that reading a single "
        + "bearing was never going to capture it, and gust speed quietly absorbs the effect "
        + "instead. The second is measurement." }));
  host.appendChild(el("p", { class: "hint",
    text: "Season 1 recorded no wind "
        + "direction at all, so the only source is a reanalysis giving one dominant direction "
        + "per day on a 25 km grid — which also under-reads ridge-top gusts badly enough that "
        + "Courchevel, Méribel and Lech never once reach 60 km/h in it. Alpine valleys bend "
        + "the wind tens of degrees, and a hold declared at 08:00 need not match the day's "
        + "average vector. Collection now records direction at 10 m and at 700 hPa at the hour "
        + "the wind peaked, so season 2 can retry this properly." }));
}

function compass(deg) {
  const pts = ["N","NNE","NE","ENE","E","ESE","SE","SSE",
               "S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return pts[Math.round((deg % 360) / 22.5) % 16];
}

function roseSvg(rose, sector) {
  const size = 340, cx = size / 2, cy = size / 2, rMax = size / 2 - 44;
  const svg = chartSvg(size, size);
  const maxPct = Math.max(10, ...rose.map(r => r.windy_pct_shut ?? 0));
  const maxDays = Math.max(1, ...rose.map(r => r.days));
  for (const frac of [0.5, 1]) {
    svg.appendChild(el("circle", { cx, cy, r: rMax * frac, fill: "none", stroke: GRID }));
    svg.appendChild(el("text", { x: cx + 3, y: cy - rMax * frac + 10, "font-size": 9,
      fill: MUTED, text: fmt(maxPct * frac, 0) + "%" }));
  }
  for (const [deg, label] of [[0, "N"], [90, "E"], [180, "S"], [270, "W"]]) {
    const a = (deg - 90) * Math.PI / 180;
    svg.appendChild(el("text", { x: cx + Math.cos(a) * (rMax + 16),
      y: cy + Math.sin(a) * (rMax + 16) + 4, "text-anchor": "middle",
      "font-size": 11, fill: INK2, text: label }));
  }
  for (const r of rose) {
    const pct = r.windy_pct_shut;
    if (pct == null) continue;
    // Width carries the evidence, length carries the claim: a fat short petal
    // is better supported than a thin tall one.
    const half = (sector / 2) * (0.35 + 0.65 * r.days / maxDays) * Math.PI / 180;
    const mid = (r.from_deg + sector / 2 - 90) * Math.PI / 180;
    const len = rMax * Math.min(1, pct / maxPct);
    const p1 = [cx + Math.cos(mid - half) * len, cy + Math.sin(mid - half) * len];
    const p2 = [cx + Math.cos(mid + half) * len, cy + Math.sin(mid + half) * len];
    const wedge = el("path", {
      d: `M${cx},${cy}L${p1[0].toFixed(1)},${p1[1].toFixed(1)}`
       + `A${len.toFixed(1)},${len.toFixed(1)} 0 0 1 ${p2[0].toFixed(1)},${p2[1].toFixed(1)}Z`,
      fill: SERIES[0], "fill-opacity": 0.28 + 0.5 * r.days / maxDays,
      stroke: SURF, "stroke-width": 1 });
    wedge.addEventListener("mousemove", e => showTip(
      `<div class="t-date">Wind from ${r.from_deg}° ${compass(r.from_deg)}</div>` +
      `<table><tr><td>Shut on windy days</td><td>${fmt(pct, 1)}%</td></tr>` +
      `<tr><td>Shut overall</td><td>${fmt(r.pct_shut, 1)}%</td></tr>` +
      `<tr><td>Days in this sector</td><td>${r.days}</td></tr>` +
      `<tr><td>Lift-readings</td><td>${r.n}</td></tr></table>`, e.clientX, e.clientY));
    wedge.addEventListener("mouseleave", hideTip);
    svg.appendChild(wedge);
  }
  return el("div", { style: "display:flex;justify-content:center;" }, svg);
}

function renderModelTable(host, ids) {
  host.appendChild(el("h3", { text: "Every resort with per-lift readings" }));
  host.appendChild(el("p", { class: "sub",
    text: "Only resorts with a primary scraper appear: the bergfex-only ones report a lift "
        + "count and nothing else, so there is no matrix to scale." }));
  const t = el("table", { class: "league" });
  t.appendChild(el("thead", {}, el("tr", {},
    el("th", { text: "resort" }), el("th", { text: "lifts" }), el("th", { text: "% shut" }),
    el("th", { text: "partly-open" }), el("th", { text: "CR" }), el("th", { text: "MMR" }),
    el("th", { text: "CS" }), el("th", { text: "CS held-out" }), el("th", { text: "verdict" }))));
  const tb = el("tbody");
  for (const id of ids) {
    const R = MODEL.resorts[id], f = R.fit;
    const tr = el("tr", { style: "cursor:pointer;" + (id === modelResort ? "background:" + WASH + ";" : "") });
    tr.addEventListener("click", () => { modelResort = id; render(); window.scrollTo({ top: 0 }); });
    const nameCell = el("td", { text: R.name });
    tr.appendChild(nameCell);
    tr.appendChild(el("td", { text: String(R.ladder.length) }));
    tr.appendChild(el("td", { text: fmt(f.pct_closed, 1) + "%" }));
    tr.appendChild(el("td", { text: String(f.mixed_snaps) }));
    tr.appendChild(el("td", { text: fmt(f.cr, 3) }));
    tr.appendChild(el("td", { text: fmt(f.mmr, 3) }));
    const cs = el("td", {});
    const bar = el("span", { class: "bar-mini" });
    const i = el("i");
    i.style.width = Math.max(0, Math.min(100, 100 * f.cs)) + "%";
    i.style.background = f.cs >= MODEL.thresholds.cs ? SERIES[2] : SERIES[3];
    bar.appendChild(i);
    cs.appendChild(bar);
    cs.appendChild(document.createTextNode(" " + fmt(f.cs, 3)));
    tr.appendChild(cs);
    tr.appendChild(el("td", { text: R.holdout ? fmt(R.holdout.cs, 3) : "—" }));
    tr.appendChild(el("td", { text: R.verdict }));
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  host.appendChild(t);
  host.appendChild(el("p", { class: "hint",
    text: "Click a row to inspect it above. Resorts marked (thin) post their score on very few "
        + "partly-open snapshots, so treat the number as a hint rather than a finding — but "
        + "St Anton, Tignes and Les Arcs each have more than forty and still fail, which is a "
        + "real result: their closures are not severity-ordered, and that is where wind "
        + "direction has to come in." }));
}

/* ---------- render dispatch ---------- */
function render() {
  hideTip();
  const host = $("#view");
  host.innerHTML = "";
  const ownControls = tab === "plan" || tab === "model" || tab === "climate"
                      || tab === "sun";
  $("#resortCtl").style.display =
    (tab === "compare" || tab === "wind" || tab === "climate") ? "" : "none";
  $("#rangeCtl").style.display = ownControls ? "none" : "";
  // Climate picks its own calendar window, so the shared date range means
  // nothing to it — but the resort chips still drive which lines it draws.
  $("#selHint").style.display = (ownControls && tab !== "climate") ? "none" : "";
  try {
    ({ heatmap: renderHeatmap, compare: renderCompare, wind: renderWind,
       lifts: renderLifts, league: renderLeague, plan: renderPlan,
       scatter: renderScatter, climate: renderClimate, sun: renderSun,
       model: renderModel })[tab](host);
  } catch (err) {
    host.appendChild(el("p", { class: "sub", text: "Render error: " + err.message }));
  }
}
let rsz;
window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(render, 200); });
load().catch(err => { $("#view").innerHTML = "<p class='sub'>Failed to load data: " + err.message + "</p>"; });
</script>
